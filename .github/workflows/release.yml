name: QMediaFlow Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/testing-release-tag']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify plugin package
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            tag="$(cat .github/testing-release-tag)"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|RC)\.[0-9]+$ ]]
          fi
          printf 'QMEDIAFLOW_RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|RC)\.[0-9]+)?$ ]]
          version="${tag#v}"
          header="$(sed -nE 's/^ \* Version:[[:space:]]+([^[:space:]]+).*/\1/p' mediaflow.php)"
          runtime="$(sed -nE "s/^define\( 'QMEDIAFLOW_VERSION', '([^']+)' \);$/\1/p" mediaflow.php)"
          [[ "$version" == "$header" && "$version" == "$runtime" ]]
          stage="$(mktemp -d)"
          mkdir "$stage/mediaflow"
          cp -r mediaflow.php uninstall.php readme.txt includes assets "$stage/mediaflow/"
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/qmediaflow.zip" mediaflow)
          unzip -tq qmediaflow.zip
          unzip -q qmediaflow.zip -d "$stage/verify"
          find "$stage/verify" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          sha256sum qmediaflow.zip > qmediaflow.zip.sha256
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$QMEDIAFLOW_RELEASE_TAG"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            # The default token does not trigger a second tag-push workflow.
            # Tag the already-tested commit and continue publishing here.
            existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[] | select(.ref == "refs/tags/'"$tag"'") | .object.sha')"
            if [[ -z "$existing" ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
            else
              [[ "$existing" == "$GITHUB_SHA" ]]
            fi
          fi
          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$tag" qmediaflow.zip qmediaflow.zip.sha256 --verify-tag --generate-notes "${flags[@]}"
